<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showroom Inmobiliario Online</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background: #0f172a; color: #fff; }
        .sidebar { width: 350px; background: #1e293b; padding: 2rem; display: flex; flex-direction: column; justify-content: space-between; z-index: 10; box-shadow: 5px 0 15px rgba(0,0,0,0.3); }
        .sidebar h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #38bdf8; }
        .sidebar p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .features { list-style: none; margin-bottom: 2rem; }
        .features li { padding: 0.5rem 0; border-bottom: 1px solid #334155; font-size: 0.95rem; }
        .cta-button { background: #38bdf8; color: #0f172a; border: none; padding: 0.75rem 1.5rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; text-align: center; text-decoration: none; display: block; }
        .cta-button:hover { background: #0ea5e9; }
        .viewer-container { flex-grow: 1; height: 100%; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 35vh; padding: 1rem; }
            .viewer-container { height: 65vh; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <h1>Edificio Lumina</h1>
            <p>Recorrido interactivo 3D en tiempo real.</p>
            <ul class="features">
                <li>📍 Ubicación estratégica</li>
                <li>📐 Unidades de 2 y 3 ambientes</li>
                <li>✨ Amenities de categoría</li>
            </ul>
        </div>
        <a href="#contacto" class="cta-button">Contactar Asesor</a>
    </div>

    <div class="viewer-container">
        <!-- Reemplaza el enlace de src con el embed de tu modelo 3D -->
        <iframe title="Showroom 3D" src="https://sketchfab.com/models/TU_ID_DE_SKETCHFAB/embed?autostart=1&ui_controls=1&ui_infos=0" allow="autoplay; fullscreen; xr-spatial-tracking"></iframe>
    </div>

</body>
</html>
