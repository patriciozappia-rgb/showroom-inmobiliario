
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Showroom de Departamentos</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.0/model-viewer.min.js">
  </script>

  <link rel="stylesheet" href="estilos.css">
</head>

<body>

<header>
  <h1>VÍA BELL</h1>
  <p>Showroom inmobiliario</p>
</header>

<section class="hero">
  <h2>Edificio residencial</h2>
  <p>Descubrí tu próximo departamento</p>
  <button onclick="irAEdificio()">Explorar edificio</button>
</section>

<section id="edificio">

  <h2>Edificio 3D</h2>

  <model-viewer
    id="modelo"
    src="URL-DE-TU-EDIFICIO.glb"
    camera-controls
    shadow-intensity="1"
    exposure="1"
    alt="Edificio residencial 3D">
  </model-viewer>

</section>

<section class="departamentos">

  <h2>Seleccioná tu departamento</h2>

  <button onclick="seleccionar('A')">Departamento A</button>
  <button onclick="seleccionar('B')">Departamento B</button>
  <button onclick="seleccionar('C')">Departamento C</button>

  <div id="informacion">
    Seleccioná una unidad para conocer sus características.
  </div>

</section>

<section class="contacto">

  <h2>Consultas comerciales</h2>

  <p>Solicitá información sobre disponibilidad.</p>

  <a href="https://wa.me/TU_NUMERO">
    Consultar por WhatsApp
  </a>

</section>

<script src="showroom.js"></script>

</body>
</html>
